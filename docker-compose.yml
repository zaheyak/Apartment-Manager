services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apartment_manager
    ports:
      - "5433:5432"
    volumes:
      - apartment_manager_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apartment_manager"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  apartment_manager_pg:
